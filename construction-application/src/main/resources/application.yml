spring:
  application:
    name: construction-company
  datasource:
    url: jdbc:h2:mem:construction-company
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true

server:
  port: 8081
